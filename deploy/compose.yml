services:
  kis-trader-back:
    image: ${IMAGE:-ghcr.io/greatbooms/kis-trader-back:latest}
    container_name: kis-trader-back
    network_mode: host
    restart: unless-stopped
    env_file:
      - ${RUNTIME_CONTAINER_ENV_FILE:-.env.prod}
    environment:
      NODE_ENV: production
      PORT: "20000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:20000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
