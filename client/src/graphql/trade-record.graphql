query GetAccountSummary {
  accountSummary {
    cashBalance
    totalInvested
    totalAssets
    totalProfitLoss
    realizedPnL
    profitRate
    positionCount
    lastSyncedAt
    cashBalances {
      market
      currencyCode
      currencyName
      amount
      withdrawableAmount
      orderableAmount
      generalOrderableAmount
      integratedOrderableAmount
      pendingBuyAmount
      pendingSellAmount
      receivableAmount
      marginAmount
    }
  }
}

query GetDashboardSummary {
  dashboardSummary {
    totalProfitLoss
    totalTradeCount
    todayTradeCount
    winRate
  }
}

mutation ManualSell($input: ManualSellInput!) {
  manualSell(input: $input) {
    success
    message
    orderNo
  }
}

mutation CancelTradeOrder($input: CancelTradeOrderInput!) {
  cancelTradeOrder(input: $input) {
    success
    message
    orderNo
  }
}

mutation RefreshAccountState {
  refreshAccountState {
    success
    message
    accountSummary {
      cashBalance
      totalInvested
      totalAssets
      totalProfitLoss
      realizedPnL
      profitRate
      positionCount
      lastSyncedAt
      cashBalances {
        market
        currencyCode
        currencyName
        amount
        withdrawableAmount
        orderableAmount
        generalOrderableAmount
        integratedOrderableAmount
        pendingBuyAmount
        pendingSellAmount
        receivableAmount
        marginAmount
      }
    }
  }
}
