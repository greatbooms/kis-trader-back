query GetTrades($input: TradeFilterInput) {
  trades(input: $input) {
    id
    market
    exchangeCode
    stockCode
    stockName
    side
    orderType
    quantity
    price
    executedPrice
    executedQty
    orderNo
    status
    cancellationStatus
    cancellationMessage
    brokerMessage
    strategyName
    reason
    createdAt
  }
}

query GetTrade($id: ID!) {
  trade(id: $id) {
    id
    market
    exchangeCode
    stockCode
    stockName
    side
    orderType
    quantity
    price
    executedPrice
    executedQty
    orderNo
    status
    cancellationStatus
    cancellationMessage
    brokerMessage
    strategyName
    reason
    createdAt
  }
}

query GetPositions($input: PositionsFilterInput) {
  positions(input: $input) {
    id
    market
    exchangeCode
    stockCode
    stockName
    quantity
    avgPrice
    currentPrice
    profitLoss
    profitRate
    totalInvested
  }
}

query GetQuote($stockCode: String!) {
  quote(stockCode: $stockCode) {
    stockCode
    stockName
    currentPrice
    changeRate
    openPrice
    highPrice
    lowPrice
    volume
    technicalRatings {
      timeframe
      oscillatorSummary {
        score
        recommendation
        buyCount
        neutralCount
        sellCount
      }
      movingAverageSummary {
        score
        recommendation
        buyCount
        neutralCount
        sellCount
      }
      overallSummary {
        score
        recommendation
        buyCount
        neutralCount
        sellCount
      }
      oscillators {
        key
        label
        value
        action
      }
      movingAverages {
        key
        label
        value
        action
      }
    }
  }
}

query GetQuoteHistory($stockCode: String!, $months: Int) {
  quoteHistory(stockCode: $stockCode, months: $months) {
    date
    close
    open
    high
    low
    volume
  }
}

