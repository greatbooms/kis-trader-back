query GetStockRecommendations($input: StockRecommendationsFilterInput) {
  stockRecommendations(input: $input) {
    id
    screeningDate
    market
    exchangeCode
    stockCode
    stockName
    totalScore
    trendScore
    timingScore
    fundamentalScore
    riskSupplyScore
    rank
    reasons
    indicators
    suggestedStrategies {
      name
      displayName
      matchScore
      reason
    }
    currentPrice
    changeRate
    volume
    marketCap
    isEtf
    deepAnalysisStatus
    deepAnalysisMessage
    deepAnalysisUpdatedAt
    factorScores {
      trend
      timing
      riskSupply
      valuation
      growth
      profitability
      risk
      supplyDemand
      dividend
      consensus
      fundamental
    }
    createdAt
  }
}

query GetScreeningDates($input: ScreeningListFilterInput) {
  screeningDates(input: $input)
}

query GetScreeningDateSummaries($input: ScreeningListFilterInput) {
  screeningDateSummaries(input: $input) {
    date
    totalCount
    countries {
      country
      label
      count
      avgScore
    }
  }
}

query GetScreeningSettings {
  screeningSettings {
    countries {
      country
      label
      enabled
    }
  }
}

mutation UpdateScreeningSettings($input: UpdateScreeningSettingsInput!) {
  updateScreeningSettings(input: $input) {
    countries {
      country
      label
      enabled
    }
  }
}

query GetStockDeepAnalysis($stockCode: String!, $date: String, $exchangeCode: String) {
  stockDeepAnalysis(stockCode: $stockCode, date: $date, exchangeCode: $exchangeCode) {
    id
    screeningDate
    stockCode
    stockName
    exchangeCode
    intrinsicValue
    marginOfSafety
    riskGrade
    volatility30d
    maxDrawdown90d
    trendDirection
    dividendYield
    targetPrice
    targetUpside
    consensusRating
    reportSummary
    dcfDetail
    riskDetail
    technicalDetail
    dividendDetail
    consensusDetail
  }
}
