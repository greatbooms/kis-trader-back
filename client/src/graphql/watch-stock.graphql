query GetWatchStocks($input: WatchStocksFilterInput) {
  watchStocks(input: $input) {
    id
    market
    exchangeCode
    stockCode
    stockName
    isActive
    strategyName
    quota
    cycle
    maxCycles
    stopLossRate
    maxPortfolioRate
    strategyParams
    lastExecutionStatus
    lastExecutionDate
    createdAt
    updatedAt
  }
}

query GetWatchStock($id: ID!) {
  watchStock(id: $id) {
    id
    market
    exchangeCode
    stockCode
    stockName
    isActive
    strategyName
    quota
    cycle
    maxCycles
    stopLossRate
    maxPortfolioRate
    strategyParams
    lastExecutionStatus
    lastExecutionDate
    createdAt
    updatedAt
  }
}

query GetWatchStockExecutionLogs($watchStockId: String!, $limit: Float) {
  watchStockExecutionLogs(watchStockId: $watchStockId, limit: $limit) {
    id
    watchStockId
    tradeRecordId
    market
    exchangeCode
    stockCode
    stockName
    strategyName
    eventType
    message
    details
    createdAt
  }
}

mutation CreateWatchStock($input: CreateWatchStockInput!) {
  createWatchStock(input: $input) {
    id
    market
    exchangeCode
    stockCode
    stockName
    isActive
    strategyName
    quota
    cycle
    maxCycles
    stopLossRate
    maxPortfolioRate
    strategyParams
    createdAt
    updatedAt
  }
}

mutation UpdateWatchStock($id: ID!, $input: UpdateWatchStockInput!) {
  updateWatchStock(id: $id, input: $input) {
    id
    market
    exchangeCode
    stockCode
    stockName
    isActive
    strategyName
    quota
    cycle
    maxCycles
    stopLossRate
    maxPortfolioRate
    strategyParams
    createdAt
    updatedAt
  }
}

mutation DeleteWatchStock($id: ID!) {
  deleteWatchStock(id: $id)
}

mutation TriggerWatchStockNow($id: ID!) {
  triggerWatchStockNow(id: $id) {
    success
    message
  }
}

mutation ResetWatchStockCarry($id: ID!) {
  resetWatchStockCarry(id: $id) {
    success
    message
  }
}

query PreviewWatchStockExecution($watchStockId: ID!, $quotaOverride: Float) {
  previewWatchStockExecution(watchStockId: $watchStockId, quotaOverride: $quotaOverride) {
    context {
      currentPrice
      avgPrice
      holdQty
      buyableAmount
      turn
      maxCycles
      cashRemaining
      mode
      dailyBuyBudget
      dailyBuyBudgetCapped
      starPct
      starPrice
      buyLimitPrice
      sellLimitPrice
      reverseStarPrice
    }
    signals {
      side
      phase
      quantity
      price
      orderDivision
      fillModel
      reason
    }
    skipReasons
    appliedQuotaOverride
  }
}

mutation ConvertWatchStockToInfiniteBuyV4($watchStockId: ID!, $dryRun: Boolean) {
  convertWatchStockToInfiniteBuyV4(watchStockId: $watchStockId, dryRun: $dryRun) {
    watchStockId
    dryRun
    applied
    isActive
    starBasePct
    turn
    cashRemaining
    lastKnownHoldQty
    mode
    cycleSeq
    warnings
  }
}
