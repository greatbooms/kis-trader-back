query GetSimulationSessions($input: SimulationSessionsFilterInput) {
  simulationSessions(input: $input) {
    id
    name
    description
    market
    exchangeCode
    stockCode
    stockName
    countryCode
    strategyName
    status
    currentCash
    quota
    cycle
    maxCycles
    stopLossRate
    strategyParams
    lastExecutionStatus
    lastExecutionDate
    lastExecutionDetails
    portfolioValue
    startedAt
    stoppedAt
    createdAt
  }
}

query GetSimulationSession($id: String!) {
  simulationSession(id: $id) {
    id
    name
    description
    market
    exchangeCode
    stockCode
    stockName
    countryCode
    strategyName
    status
    currentCash
    quota
    cycle
    maxCycles
    stopLossRate
    strategyParams
    lastExecutionStatus
    lastExecutionDate
    lastExecutionDetails
    portfolioValue
    startedAt
    stoppedAt
    createdAt
  }
}

query GetSimulationPositions($sessionId: String!) {
  simulationPositions(sessionId: $sessionId) {
    id
    market
    exchangeCode
    stockCode
    stockName
    quantity
    avgPrice
    currentPrice
    totalInvested
    profitLoss
    profitRate
  }
}

query GetSimulationTrades($input: SimulationTradesFilterInput!) {
  simulationTrades(input: $input) {
    id
    market
    exchangeCode
    stockCode
    stockName
    side
    quantity
    price
    totalAmount
    tradeStatus
    failReason
    strategyName
    reason
    createdAt
  }
}

query GetSimulationSnapshots($sessionId: String!) {
  simulationSnapshots(sessionId: $sessionId) {
    id
    snapshotDate
    portfolioValue
    cashBalance
    totalValue
    dailyPnl
    dailyPnlRate
    drawdown
    peakValue
    positionCount
    tradeCount
  }
}

query GetSimulationMetrics($sessionId: String!) {
  simulationMetrics(sessionId: $sessionId) {
    totalReturn
    totalReturnAmount
    realizedPnL
    unrealizedPnL
    maxDrawdown
    winRate
    totalTrades
    winTrades
    lossTrades
    sharpeRatio
    profitFactor
    currentCash
    currentPortfolioValue
  }
}

mutation CreateSimulation($input: CreateSimulationInput!) {
  createSimulation(input: $input) {
    id
    name
    market
    exchangeCode
    stockCode
    stockName
    countryCode
    strategyName
    status
    currentCash
    quota
    cycle
    maxCycles
    stopLossRate
    strategyParams
  }
}

mutation UpdateSimulationSettings($input: UpdateSimulationSettingsInput!) {
  updateSimulationSettings(input: $input) {
    id
    name
    stopLossRate
    maxCycles
  }
}

mutation UpdateSimulationStatus($input: UpdateSimulationStatusInput!) {
  updateSimulationStatus(input: $input) {
    id
    status
    stoppedAt
  }
}

mutation ResetSimulation($id: String!) {
  resetSimulation(id: $id) {
    id
    status
    currentCash
    quota
  }
}

mutation DeleteSimulation($id: String!) {
  deleteSimulation(id: $id)
}

mutation TriggerSimulationNow($id: String!) {
  triggerSimulationNow(id: $id) {
    success
    message
  }
}
